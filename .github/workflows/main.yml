name: Build MAUI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore FoodExpiryApp.csproj

    # Сборка строго через .csproj (игнорируем сломанный .sln файл)
    - name: Publish Android APK
      run: |
        dotnet publish FoodExpiryApp.csproj -c Release -f net8.0-android /p:AndroidBuildApplicationPackage=true

    # Поиск файлов строго по всему рабочему пространству
    - name: Find and Copy APKs
      run: |
        New-Item -ItemType Directory -Force -Path .\DropBox
        Get-ChildItem -Path . -Recurse -Include *.apk, *.aab | Copy-Item -Destination .\DropBox\
        Write-Host "Содержимое папки DropBox:"
        Get-ChildItem -Path .\DropBox
      shell: pwsh

    # Загрузка собранных файлов из DropBox
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maui-android-apk
        path: .\DropBox\
