name: Build MAUI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Жестко ставим старую версию SDK 8.0.204, где net8.0-android НЕ заблокирован
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.204'

    # Принудительно ставим воркфлоу именно для восьмой версии
    - name: Install MAUI Workload
      run: dotnet workload install maui --sdk-version 8.0.204

    - name: Restore dependencies
      run: dotnet restore FoodExpiryApp.csproj

    # Собираем проект напрямую через .csproj
    - name: Publish Android APK
      run: |
        dotnet publish FoodExpiryApp.csproj -c Release -f net8.0-android /p:AndroidBuildApplicationPackage=true

    # Скрипт гарантированно вытащит APK, где бы он ни лежал
    - name: Find and Copy APKs
      run: |
        New-Item -ItemType Directory -Force -Path .\DropBox
        Get-ChildItem -Path . -Recurse -Include *.apk, *.aab | Copy-Item -Destination .\DropBox\
        Write-Host "Содержимое папки DropBox:"
        Get-ChildItem -Path .\DropBox
      shell: pwsh

    # Загружаем готовый APK в артефакты
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maui-android-apk
        path: .\DropBox\
