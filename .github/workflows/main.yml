name: Build MAUI Android APK

on:
  workflow_dispatch:

# Отключаем ебучую проверку EOL глобально для всей виртуальной машины
env:
  CheckEolTargetFramework: "false"
  CheckEolWorkloads: "false"
  MSBUILDDISABLENETSDK1202: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore FoodExpiryApp.csproj

    # Сборка без единого шанса для ошибки NETSDK1202
    - name: Publish Android APK
      run: |
        dotnet publish FoodExpiryApp.csproj -c Release -f net8.0-android /p:AndroidBuildApplicationPackage=true

    # Скрипт перенесет APK в DropBox
    - name: Find and Copy APKs
      run: |
        New-Item -ItemType Directory -Force -Path .\DropBox
        Get-ChildItem -Path . -Recurse -Include *.apk, *.aab | Copy-Item -Destination .\DropBox\
        Write-Host "Содержимое папки DropBox:"
        Get-ChildItem -Path .\DropBox
      shell: pwsh

    # Загружаем готовый APK в артефакты
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maui-android-apk
        path: .\DropBox\
